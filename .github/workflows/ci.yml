name: TAKATALK-CI

on:
  push:
    branches: ["develop", "master"]
  pull_request:
    branches: ["develop", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
      - uses: actions/checkout@v4

      # 1. Java 21 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 빌드 및 테스트 진행
      - name: Build with Gradle
        run: ./gradlew build

      # 빌드 성공 후 생성된 JAR 파일을 Github Artifact에 업로드
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: takatalk-jar
          path: build/libs/*.jar
