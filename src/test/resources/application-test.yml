spring:
  application:
    name: chat-test
---
#DB #h2database
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true        # 콘솔에 SQL 출력 (system.println 으로 출력되므로 운영단계에서는 쓰지않는다.)
    properties:
      hibernate:
        format_sql: true  # 가독성좋게 포맷팅
        jdbc:
          batch_size: 50  # 한번에 전송할수있는 SQL문의 개수 (일괄처리)
        order_inserts: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

---
#에러처리
spring:
  messages:
    encoding: UTF-8
    basename: errors, messages
---
# loging level
logging:
  level:
    com.example.chat.user2 :

---
#smtp
spring:
  mail:
    host: smtp.test.com
    port: 587
    username: test_user
    password: test_password

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # 보안 설정 (기본 유저)
  security:
    user:
      name: test_admin
      password: test_password
---
#BASE_URL
app:
  base-url: http://localhost:8080
---
# FILE UPLOAD PATH
file:
  upload:
    upload-path: ./test-uploads
---
server:
  servlet:
    session:
      timeout: 5m
      cookie:
        http-only: true