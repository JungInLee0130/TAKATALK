#env.yml
spring:
  config:
    import: env.yml
---
#h2database
spring:
  application:
    name: chat
---
#DB
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: 'jdbc:h2:mem:test'
    username: ${H2_USERNAME}
    password: ${H2_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

---
#에러처리
spring:
  messages:
    encoding: UTF-8
    basename: errors, messages
---
# loging level
logging:
  level:
    com.example.chat.user2 :

---
#smtp
spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          starttls:
            enable: true
          auth: true
---
#BASE_URL
app:
  base-url: ${BASE_URL}