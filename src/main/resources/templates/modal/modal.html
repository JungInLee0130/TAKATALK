    /*.container .modal-outside {

    .login-modal {
        display: none;
        position: absolute;

        top:0;
        left:0;

        width: 100%;
        height: 100%;

        background-color: rgba(0,0,0,0.4);
    }

    .modal-body {
        position: absolute;
        top: 50%;
        left: 50%;

        width: 500px;
        height: 240px;

        padding: 16px 32px;

        background-color: rgb(0, 0, 0);
        border-radius: 10px;
        box-shadow: 0 2px 3px 0 rgba(34, 36, 38, 0.15);

        transform: translate(-50%, -50%); /*자신의 전체너비, 높이의 절반만큼 왼쪽,위로이동*/

        color: white;
        font-size: 16px;
    }

    .modal-body h2{
        margin-bottom: 10px;
    }

    .modal-body p {
        margin: 0;
    }

    .login-modal .confirm-btn-wrapper {
    }
    .login-modal #confirmBtn{
        width: 100px;
        height: 40px;

        position: absolute;
        bottom: 0;
        right: 0;
        transform: translate(-20px, -20px);

        border-radius: 10px;
        border-color: rgba(0,0,0,0);

        text-align: center;
        line-height: 2px; /* ? */

        padding: 0;
        color: white;
        background-color: red;
    }
</style>
<body>
    <div th:fragment="login-modal-fragment" class="login-modal" id="loginModal">
        <div class="modal-body">
            <h2>지시사항 이메일로 전송완료</h2>
            <p>계정 비밀번호 변경 방법을 <span style="font-family: bold">이메일</span>(으)로 보냈어요. 받은 편지함 또는 스팸함을 확인해 주세요.</p>
            <div class="confirm-btn-wrapper">
                <button type="button" id="confirmBtn">확인</button>
            </div>
        </div>
    </div>
</body>

    const loginModal = document.getElementById("modal");
    const confirmBtn = document.getElementById("confirmBtn");
    confirmBtn.onclick = () => {
        loginModal.style.display = "none";
