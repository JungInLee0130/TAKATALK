<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #eee;
        }

        .split-section {
            display: flex;
            align-items: center;
            gap: 100px;
            font-family: "Roboto", sans-serif;
            padding: 32px;
            color: #023047;
        }/**/

        .split-section .left {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 800px;
            height : 600px;
            background-color: skyblue;
        }

        .split-section .left img {
            object-fit: none;
        }

        .split-section h2 {
            font-size: 40px;
            font-weight: normal;
            margin-top: 8px;
            color: #006d77;
            border-bottom: 1px solid rgba(2, 48, 71, 0.2);
            padding-bottom: 20px;
        }
        .step {
            display: flex;
            gap: 16px;
            padding: 16px 24px;
            width: 100%;
            border-radius: 10px;
        }

        .step .step-heading {
            font-size: 26px;
            font-weight: bold;
        }

        .step p {
            margin: 8px 0;
        }

        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .steps-container img{
            width: 75px;
            height: 75px;
        }

        .step.active {
            box-shadow: 0 4px 40px -8px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 900px) {
            .split-section {
                flex-direction: column;
            }
            .split-section .left {
                width: 100%;
                height: 400px;
                flex: unset;
            }
            .split-section .left{
                width: 100%;

            }
        }
    </style>
    <!--<link rel="stylesheet" href="/css/style.css">-->
</head>
<body>
    <div class="split-section">
        <div class="left">
            <img src="/images/wuwa-icon.png">
        </div>
        <div class="right">
            <h2> Steps to complete </h2>
            <div class="steps-container">
                <div class="step active">
                    <div class="icon">
                        <img src="/images/meeng.png">
                    </div>
                    <div>
                        <div class="content">
                            <div class="step-heading">Heading No.1</div>
                            <p>This is heading No.1</p>
                        </div>
                    </div>
                </div>
                <div class="step">
                    <div class="icon">
                        <img src="/images/meeng.png">
                    </div>
                    <div>
                        <div class="content">
                            <div class="step-heading">Heading No.2</div>
                            <p>This is heading No.2</p>
                        </div>
                    </div>
                </div>
                <div class="step">
                    <div class="icon">
                        <img src="/images/meeng.png">
                    </div>
                    <div>
                        <div class="content">
                            <div class="step-heading">Heading No.3</div>
                            <p>This is heading No.3</p>
                        </div>
                    </div>
                </div>
                <div class="step">
                    <div class="icon">
                        <img src="/images/meeng.png">
                    </div>
                    <div>
                        <div class="content">
                            <div class="step-heading">Heading No.4</div>
                            <p>This is heading No.4</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
    <!--<script src="/js/main.js">-->
        const steps = document.querySelectorAll(".step");
        let currentStepIndex = 0;

        const showCurrentStep = () => {
            steps.forEach((step, index) => {
                step.classList.toggle("active", index === currentStepIndex)
            });
            currentStepIndex = (currentStepIndex + 1) % steps.length;
        }

        showCurrentStep();

        const intervalId = setInterval(showCurrentStep, 3000);
    </script>
</body>
</html>
