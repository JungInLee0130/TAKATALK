<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>비밀번호 변경</title>
</head>
<style>
    body {
        margin: 0;
    }
    .container {
        display:flex;
        flex-direction: column;

        justify-content: center;
        width: 400px;
        border: 1px solid black;
        border-radius: 10px;
    }
    .password-change-btn-wrapper button {
        width: 100px;
        height: 24px;
    }

    #passwordErrorMsg {
        color: red;
    }
</style>
<body>
    <div class="container">
        <h2>새 비밀번호</h2>
        <hr/>
        <p>새 비밀번호를 입력해주세요.</p>
        <div class="new-password-wrapper">
            <label for="newPassword">새 비밀번호:</label>
            <input id="newPassword" type="password"/>
        </div>
        <div class="new-password-verify-wrapper">
            <label for="newPasswordVerify">새 비밀번호 확인:</label>
            <input id="newPasswordVerify" type="password"/>
        </div>
        <div class="password-error-msg-wrapper">
            <p id="passwordErrorMsg"></p>
        </div>

        <div class="password-change-btn-wrapper">
            <button type="button" id="passwordChangeBtn">변경하기</button>
        </div>
    </div>
</body>
<!--ajax-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", (event) => {
        /*
        * 비밀번호 변경
        * 1. 비밀번호 일치하면
        * 2. 변경
        * */
       document.getElementById("passwordChangeBtn").onclick = () => {
           let emailToken = [[${token}]]; // resetToken(JSON)
           let password = document.getElementById("newPassword").value;
           let passwordVerify = document.getElementById("newPasswordVerify").value;

           console.log(emailToken);

           if (password === passwordVerify) {
               $.ajax({
                  type: 'POST',
                   url: '/login/verify-resetToken',
                   contentType: 'application/json',
                   data: JSON.stringify({
                       resetToken: emailToken,
                   }),
                   success : function (response) {
                       console.log(response + " " + typeof response);
                       let email = response;
                       $.ajax({
                           type: 'POST',
                           url: '/login/change-password',
                           contentType: 'application/json',
                           data: JSON.stringify({
                               token : emailToken,
                               password : password
                           }),
                           success : function (response) {
                               if (response === "SUCCESS") {
                                   console.log("비밀번호 변경완료");
                                   alert("비밀번호 변경이 완료되었습니다. 새 비밀번호로 로그인해주세요.");
                                   window.location.href = "/login";
                               }
                           },
                           error : function (request, error) {
                               console.log(request.responseJSON.message);
                               document.getElementById("passwordErrorMsg").innerText = request.responseJSON.message;
                           }
                       });
                   },
                   error : function (request, error) {
                      // 토큰 검증 에러 + 서버에러 : alert
                       alert(request.responseJSON.message);
                   }
               });
           } else {
               document.getElementById("passwordErrorMsg").innerText = "비밀번호가 일치하지않습니다."
           }
       }
    });
</script>
</html>
