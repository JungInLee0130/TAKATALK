<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>비밀번호 변경</title>
</head>
<style>
    body {
        margin: 0;
        background-image: url("../../static/images/discord-background.svg");
        background-repeat: no-repeat;
        background-size: cover;
        /*background-image: linear-gradient(to right,#18004D,#1E55DC);*/
    }
    .logo {
        position: absolute;
        top:50px;
        left:50px;
    }
    .container {

    }
    .change-password-wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        padding: 32px 32px;

        background-color : #393A41;
        color: white;

        font-family: sans-serif;
        font-size: 16px;

        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        width: 416px;
        border: none;
        border-radius: 10px;
        box-shadow: 0px 2px 3px 0 rgba(34, 36, 38, 0.15);
    }
    .discord-change-password-wrapper {
        margin: 0 auto;
    }
    .discord-change-password {
        /*기본값은 fill이므로 원본을 유지하려면 설정해줘야됨.*/
        object-fit: none;
    }

    .change-password-header {
        margin: 0 auto;
    }

    .change-password-wrapper h2 {
        margin: 0;
    }

    .change-password-wrapper p {
        margin: 0;
        text-align: center;
    }

    .change-password-wrapper label {
        display: block;
        margin-bottom: 5px;
    }
    .change-password-wrapper input {
        padding: 1px 10px;
        margin-bottom: 5px;
        width: 100%;
        height: 40px;
        background-color: #2E2E34;
        border-radius: 10px;
        border: none;
        color:#A5A6AC;

        -ms-box-sizing: border-box; /* ie8 */
        -khtml-box-sizing: border-box; /* konqueror */
        -webkit-box-sizing: border-box; /* Safari/Chrome, other WebKit */
        -moz-box-sizing: border-box;    /* Firefox, other Gecko */
        box-sizing: border-box;         /* Opera/IE 8+ */
        box-sizing: border-box; /* css3 rec */
    }

    input:focus {
        border: 1px solid black;
        border-color: #7BB0F5;
        outline: none;
    }

    .change-password-wrapper #passwordChangeBtn {
        width: 100%;
        height: 50px;
        padding: 7px 15px;
        border: none;
        border-radius: 10px;
        background-color: #5865F2;
        color: white;
        font-size: 16px;
    }

    #passwordErrorMsg {
        color: red;
    }
</style>
<body>
    <div class="container">
        <div class="logo">
            <img src="../../static/images/discord-logo.svg" class="discord-logo">
            <!--<img th:src="@{images/discord-logo.svg}" class="discord-logo">-->
        </div>
        <div class="change-password-wrapper">
            <div class="discord-change-password-wrapper">
                <img src="../../static/images/discord-change-password.svg" class="discord-change-password">
            </div>
            <div class="change-password-header">
                <h2>비밀번호 변경하기</h2>
            </div>
            <div class="new-password-wrapper">
                <label for="newPassword">새 비밀번호 <span style="color:red">*</span></label>
                <input id="newPassword" type="password"/>
            </div>
            <div class="new-password-verify-wrapper">
                <label for="newPasswordVerify">새 비밀번호 확인 <span style="color:red">*</span></label>
                <input id="newPasswordVerify" type="password"/>
            </div>
            <div class="password-error-msg-wrapper">
                <p id="passwordErrorMsg"></p>
            </div>

            <div class="password-change-btn-wrapper">
                <button type="button" id="passwordChangeBtn">비밀번호 변경하기</button>
            </div>
        </div>
    </div>
</body>
<!--ajax-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script th:inline="javascript">
    /*
    * ajax 요청시 자동으로 header에 csrf 토큰 삽입
    * */
    $(function () {
        var csrfToken = [[${_csrf.token}]];
        var csrfHeader = [[${_csrf.headerName}]];

        $(document).ajaxSend(function (e, xhr, options) {
            xhr.setRequestHeader(csrfHeader, csrfToken);
        });
    })

    document.addEventListener("DOMContentLoaded", (event) => {
        /*
        * 비밀번호 변경
        * 1. 비밀번호 일치하면
        * 2. 변경
        * */
       document.getElementById("passwordChangeBtn").onclick = () => {
           let emailToken = [[${token}]]; // resetToken(JSON)
           let password = document.getElementById("newPassword").value;
           let passwordVerify = document.getElementById("newPasswordVerify").value;

           console.log(emailToken);

           if (password === passwordVerify) {
               $.ajax({
                  type: 'POST',
                   url: '/login/verify-resetToken',
                   contentType: 'application/json',
                   data: JSON.stringify({
                       resetToken: emailToken,
                   }),
                   success : function (response) {
                       console.log(response + " " + typeof response);
                       let email = response;
                       $.ajax({
                           type: 'POST',
                           url: '/login/change-password',
                           contentType: 'application/json',
                           data: JSON.stringify({
                               token : emailToken,
                               password : password
                           }),
                           success : function (response) {
                               if (response === "SUCCESS") {
                                   console.log("비밀번호 변경완료");
                                   alert("비밀번호 변경이 완료되었습니다. 새 비밀번호로 로그인해주세요.");
                                   window.location.href = "/login";
                               }
                           },
                           error : function (request, error) {
                               console.log(request.responseJSON.message);
                               document.getElementById("passwordErrorMsg").innerText = request.responseJSON.message;
                           }
                       });
                   },
                   error : function (request, error) {
                      // 토큰 검증 에러 + 서버에러 : alert
                       alert(request.responseJSON.message);
                   }
               });
           } else {
               document.getElementById("passwordErrorMsg").innerText = "비밀번호가 일치하지않습니다."
           }
       }
    });
</script>
</html>
