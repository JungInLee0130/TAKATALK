<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<style>
    body{
        margin: 0;
        width: auto;
        height: auto;
    }
    .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        min-height: 80vh;
        background-image: linear-gradient(to right,#18004D,#1E55DC);
    }
    .container .login-logo {
        position: fixed;
        top:30px;
        left:30px;
    }
    .container .login-logo img {
        object-fit: none;
    }
    .container .login {
        border: 1px solid black;
        border-radius: 10px;
        padding: 0 40px;
        padding-top : 10px;
        padding-bottom: 40px;
        width: 480px;
        background-color: #393A41;
    }
    .login h2{
        text-align: center;
        color: #FFFFFF;
    }
    .login label {
        display: block;
        margin-bottom: 5px;
        font-size: 16px;
        color: #FFFFFF;
    }
    .login input {
        float: left;
        width: 100%;
        -ms-box-sizing: border-box; /* ie8 */
        -khtml-box-sizing: border-box; /* konqueror */
        -webkit-box-sizing: border-box; /* Safari/Chrome, other WebKit */
        -moz-box-sizing: border-box;    /* Firefox, other Gecko */
        box-sizing: border-box;         /* Opera/IE 8+ */
        box-sizing: border-box; /* css3 rec */
        height: 40px;
        border: 1px solid black;
        border-radius: 5px;
        padding: 1px 10px;
        margin-bottom: 10px;
        font-size: 16px;
    }
    .login a {
        display: block;
        padding-bottom: 10px;
        color: #6C6D74;
    }
    .login .send-change-password-wrapper {

    }
    .login .send-change-password-wrapper button {
        padding: 0;
        background: none;
        border: none;
        font-size: 16px;
        margin-bottom: 10px;
        color: #93A7FD;
    }

    .login .login-button-wrapper{

    }
    .login .login-button-wrapper button {
        float: left;
        width: 100%;
        -ms-box-sizing: border-box; /* ie8 */
        -khtml-box-sizing: border-box; /* konqueror */
        -webkit-box-sizing: border-box; /* Safari/Chrome, other WebKit */
        -moz-box-sizing: border-box;    /* Firefox, other Gecko */
        box-sizing: border-box;         /* Opera/IE 8+ */
        box-sizing: border-box; /* css3 rec */
        height: 40px;
        border: 1px solid black;
        border-radius: 5px;
        margin-right: 10px;
        margin: 1px 0;
        font-size: 16px;
        background-color: #4452BB;
        color: white;
    }
    .login .find-account {
        float: left;
        width: 100%;
        -ms-box-sizing: border-box; /* ie8 */
        -khtml-box-sizing: border-box; /* konqueror */
        -webkit-box-sizing: border-box; /* Safari/Chrome, other WebKit */
        -moz-box-sizing: border-box;    /* Firefox, other Gecko */
        box-sizing: border-box;         /* Opera/IE 8+ */
        box-sizing: border-box; /* css3 rec */
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
        text-align: center;
    }
    .login .find-account p {
        margin: 10px 0;
        color: #ADAEB4;
    }
    .login .find-account a {
        padding: 0;
        color: #7380BA;
    }

    .error-msg {
        margin: 10px 0px;
        color: #E88985;
    }
    .field-error {
        margin: 10px 0px;
        color: #E88985;
    }
</style>
<style th:replace="~{modal/modal :: modal-css}"></style>
<body>
    <div class="container">
        <div class="login-logo">
            <img th:src="@{images/discord-logo.svg}" class="discord-logo">
        </div>
        <div class="login">
            <form th:action="@{/login}" th:object="${userLoginForm}" method="post">
                <h2>로그인</h2>
                <div class="login-email">
                    <label for="email">이메일<span style="color: red;">*</span></label>
                    <input id="email" type="email" th:field="*{email}" required>
                    <p id="emailErrorMsg" class="error-msg"></p>
                </div>
                <div class="login-password">
                    <label for="password">비밀번호<span style="color: red;">*</span></label>
                    <input id="password" type="password" th:field="*{password}" required>
                    <p id="passwordErrorMsg" class="error-msg"></p>
                </div>
                <div class="global-error-msg-wrapper">
                    <p id = "globalErrorMsg" class="error-msg"></p>
                </div>
                <div class="send-change-password-wrapper">
                    <button type="button" id="sendChangePasswordBtn">비밀번호를 잊으셨나요?</button>
                    <!--비밀번호 재설정 클릭시-->
                    <div th:replace="~{modal/modal :: modal-fragment}"></div>
                </div>
                <div class="login-button-wrapper">
                    <button type="button" id="loginBtn">로그인</button>
                </div>
                <div class="find-account">
                    <p>계정이 필요한가요?</p>
                    <a th:href="@{/user/signup}">가입하기</a>
                </div>
            </form>
      </div>
  </div>
</body>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script th:replace="~{modal/modal :: modal-js}"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', (event) => {
        /*
        * 이메일 검증
        * */
        function validateEmail(email) {
            var emailRegex = new RegExp("^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,6}$");

            if (email == '' || email == null) {
                document.getElementById("emailErrorMsg").innerText = "필수 입력칸이에요.";
                return false;
            } else if (!email.match(emailRegex)) {
                // 이메일 정규표현식 만족못하면
                console.log("이메일 형식을 다시 작성해주세요.")
                document.getElementById("emailErrorMsg").innerText = "이메일 형식을 다시 작성해주세요.";
                return false;
            }
            return true;
        }

        /*
        * 비밀번호 재설정 메일 버튼 클릭시
        * */
        document.getElementById("sendChangePasswordBtn").onclick = () => {
            var email = document.getElementById("email").value;
            console.log(email);

            if(!validateEmail(email)) return;

            /*
            * 유효성 검증 성공시 modal창 활성화
            * */
            modal.style.display = "block";

            $.ajax({
                type: 'POST',
                url: '/login/send-change-password',
                contentType: 'application/json',
                data: JSON.stringify({
                   mail : email
                }),
                success: function (response) {
                  if (response === "SUCCESS") {
                      document.getElementById("emailErrorMsg").innerText = "";
                      document.getElementById("passwordErrorMsg").innerText = "";
                  } else {
                      alert(response);
                  }
                },
                error : function (request, error) {
                    let errorCode = request.responseJSON.code;
                    let errorMsg = request.responseJSON.message;
                    console.log(errorCode + ": " + errorMsg);

                    switch (errorCode) {
                        case "COMMON_001" :
                            document.getElementById("emailErrorMsg").innerText = "유효하지않는 아이디 또는 비밀번호 입니다.";
                            break;
                        case "MEMBER_001":
                            document.getElementById("emailErrorMsg").innerText = "존재하지 않는 이메일이에요.";
                            document.getElementById("passwordErrorMsg").innerText = "";
                            break;
                        default :
                            // SERVER_ERROR
                            alert("임시 비밀번호 발송에 실패했습니다. 다시 시도해주세요.");
                            document.getElementById("emailErrorMsg").innerText = "임시 비밀번호 발송에 실패했습니다. 다시 시도해주세요.";
                            break;
                    }
                }
            });
        };

        /*
        * 로그인 버튼 클릭시
        * */
        document.getElementById("loginBtn").onclick = () => {
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            let passwordRegex = new RegExp("^[]")
            if(!validateEmail(email)) {
                return;
            }
            if (8 > password.length || password.length > 25) {
                return;
            }

            $.ajax({
                type: 'POST',
                url: '/login',
                contentType: 'application/json',
                data: JSON.stringify({
                   email: email,
                   password: password
                }),
                success: function (response) {
                  if (response === "LOGIN_SUCCESS") {
                      console.log("로그인 성공!")
                      window.location.href = '/chat/main';
                  } else {
                      console.log("?");
                  }
                },
                error : function (request, error) {
                    let errorCode = request.responseJSON.code;
                    let errorMsg = request.responseJSON.message;
                    console.log(errorCode + ": " + errorMsg);

                    switch (errorCode) {
                        case "COMMON_001":
                            document.getElementById("emailErrorMsg").innerText = "유효하지않는 아이디 또는 비밀번호 입니다.";
                            document.getElementById("passwordErrorMsg").innerText = "유효하지않는 아이디 또는 비밀번호 입니다.";
                            break;
                        case "MEMBER_001":
                            /*"가입된 사용자가 아닙니다."*/
                            document.getElementById("emailErrorMsg").innerText = request.responseJSON.message;
                            document.getElementById("passwordErrorMsg").innerText = "";
                            break;
                        case "LOGIN_001" :
                            document.getElementById("emailErrorMsg").innerText = "유효하지않는 아이디 또는 비밀번호 입니다.";
                            document.getElementById("passwordErrorMsg").innerText = "유효하지않는 아이디 또는 비밀번호 입니다.";
                            break;
                        default:
                            alert(request.responseJSON.message);
                            break;
                    }
                }
            });
        }
    });
</script>
</html>
