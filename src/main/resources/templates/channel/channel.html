<!--채팅방 메인화면-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
  <title>channel</title>
</head>
<!--<link rel="stylesheet" type="text/css" href="/css/chatList.css"/>-->
<style>
  * {
    /*box-sizing all*/
    box-sizing: border-box;
    font-family: sans-serif;
  }
  body {
    margin: 0;
    background: #1A1A1E;
    min-height: 100vh;
    overflow: hidden;
  }
  .container {
    display: flex;
    min-height: 100%;
  }
  .left-container {
    display: flex;
    flex-direction: column;
    width: 20vw;
    background-color: #5865F2;
    box-sizing: border-box;
  }
  .left-container .left-object {
    display: flex;
    width: 100%;
    flex-direction: row;
    box-sizing: border-box;
  }
  .left-container .character-info {
    margin: 0;
    background-color: darkgray;
    height: 10vh;
  }
  .left-container .character-info p{
    margin : 0;
    text-align: center;
    line-height: 10vh;
    height: 10vh;
  }
  .left-bar {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 60px;
    height: 90vh;
    background-color: skyblue;
  }
  .group-icon-wrapper {
    width: 100%;
    height: 60px;
    padding: 2px;
    border: 1px solid black;
    background-color: coral;

  }
  .group-icon-wrapper a {
    width: 100%;
    height: 100%;
  }
  .group-icon-wrapper a img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .group-icon-wrapper a img:hover {
    padding: 5px;
    opacity: 0.9;
  }

  .left {
    display: flex;
    flex-direction: column;
    width: 250px;
    height: 90vh;
    background-color: beige;
    box-sizing: border-box;

    /*x축 스크롤 관련*/
    overflow-x: auto;
    overflow: hidden;
  }
  .left .chat-list {
    border: 1px solid black;
    margin: 0 5px;
    padding: 0 5px;
    border-radius: 7px;
  }
  .chat-list-body a{
    text-decoration: none;
  }
  .chat-list-body .chatroom-btn-wrapper {

  }
  .left .chat-list h3 {
    text-align: center;
  }
  .left .chat-list p {
    border: 1px solid black;
    border-radius: 7px;
    margin: 0;
  }
  .left .left-header {
    width: 300px;
  }
  .left-header h2{
    width: 100%;
    text-align: center;
  }

  .channel-categorized-group {
    width: 100%;
    box-sizing: border-box;
  }
  .categorized-channel-table {
    width: 100%;
    border: 1px solid black;
  }
  .categorized-channel-table-body {

  }
  .categorized-channel-table-row {
    border: 1px solid black;
  }

  .chat-list .chat-list-header {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
  }
  .chat-list-body {
    display: flex;
    justify-content: space-between;
  }

  .left .chatTable {
    width: 410px;
    background-color: beige;
    border: 1px solid black;
    border-radius: 10px;
  }
  /*****************************************************************/
  /**********************채팅창 css********************************/
  .center{
    display: flex;
    flex-direction: column;
    width: 60vw;
    background-color: skyblue;
    gap: 5px;
    padding: 10px;
    box-sizing: border-box;
  }
  .center-header{
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;

    height: 10vh;

    background-color: #006d77;
  }
  .center-header h2{
    margin-left: 10px;
    text-align: center;
  }
  .center-header .icon {

  }
  .center-header #chatUserlist {
    margin: 10px 0;
    width: 50px;
    height: 45px;
    margin-right: 10px;
  }
  .chat-box {
    display: flex;
    flex-direction: column-reverse;
    overflow-y: auto; /*내용이 넘치면 자동으로 스크롤 생성*/
    height: 80vh;
    box-sizing: border-box;
  }
  .chatmessage-wrapper,
  .inputmessage-wrapper {
    display: flex;
    width: 100%;
    height: 80px;
    font-size: 16px;
    margin: 0;
    gap: 10px;
    box-sizing: border-box;
    border: 1px solid black;
  }
  .chatmessage-profile-wrapper {
    margin: 0;
    width: 100px;
    height: 100%;
    box-sizing: border-box;
    border: 1px solid black;
  }
  .chatmessage-profile {
    margin: 0;
    padding: 10px;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 1px solid black;
    box-sizing: border-box;
  }
  .chatmessage-second-wrapper{
    margin: 0;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    border: 1px solid black;
  }
  .chatmessage-upper-wrapper {
    margin: 0;
    display: flex;
    border: 1px solid black;
    gap: 10px;
    box-sizing: border-box;
  }
  .chatmessage-nickname-wrapper {
    margin: 0;
  }
  .chatmessage-nickname {
    margin: 0;
    padding: 5px;
  }
  .chatmessage-createdat-wrapper {
    margin: 0;
  }
  .chatmessage-createdat {
    margin: 0;
    padding: 5px;
  }
  .chatmessage-content-wrapper {
    margin: 0;
    padding: 5px;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    border: 1px solid black;
  }
  .chatmessage-content {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0px 5px;
    border: 1px solid black;
  }

  .center textarea{
    /*width: 890px;
    height: 530px;*/
    padding: 10px;

    width: 100%;
    height: 80vh;
  }

  .center .chat-input-wrapper{
    display: flex;
    flex-direction: row;
    height: 10vh;
  }
  .center .chat-input-wrapper #uploadFileBtn{
    width: 5%;
    height: 45px;
  }
  .chat-input-wrapper input {
    font-size: 15px;
    padding: 0 10px;
    width: 85%;
    height: 45px;
    margin: 0 5px;
  }
  .chat-input-wrapper #sendMsgBtn {
    margin: 0;
    width: 10%;
    height: 45px;
  }
  /*****************************************************************/
  /**********************접속자 창 css********************************/
  .container .right {
    width: 20vw;
    display: flex;
    flex-direction: column;
    background-color: darkgray;

    box-sizing: border-box;
    padding: 10px 32px;
  }
  .right h2{
    text-align: center;
  }
  .chatRoom {
    text-align: center;
  }
  .chatRoom .room{
    background-color: skyblue;
    border: 1px solid black;
  }
  .chatRoom .roomPeopleCount{
    background-color: skyblue;
    border: 1px solid black;
  }
  .chatRoom .roomEnterButton{
    text-align: left;
  }
  .enterButton{
    border: 1px solid black;
    padding: 2px;
    padding-left: 5px;
    padding-right: 5px;
    text-decoration: none;
  }
  .enterButton:hover{
    text-decoration: underline;
  }
</style>
<!--<style th:replace="~{modal/invite-channel-modal :: invite-modal-fragment}"></style>-->
<body>
  <div class="container">
    <div class="left-container">
      <div class="left-object">
        <div class="left-bar">
          <div th:if="${groups != null}">
            <div class="group-icon-wrapper" th:each="group : ${groups}">
              <a th:href="@{/group/access/{groupId}(groupId = ${group.id})}" class="group-link">
                <img class="group-icon" th:src="@{${group.profile}}" th:alt="${group.name} + '아이콘'">
            <!--<span th:if="${group.hasNewMessage}" class="notification-badge">
                  <span th:text="${group.newMessageCount}">1</span>
                </span>-->
              </a>
            </div>
          </div>
          <!--그룸생성 페이지 이동-->
          <div class="create-group-btn-wrapper">
            <a th:href="@{/group/createPage}" id="createGroupBtn">create Group</a>
          </div>
        </div>

        <!--**채팅방 목록**-->
        <div class="left">
          <div class="left-header">
            <h2>방제목</h2>
            <div th:if="${currentGroup}">
              <a th:href="@{/category/create/{groupId}(groupId = ${currentGroup.id})}">카테고리 생성</a>
            </div>
            <div th:if="${currentGroup}">
              <a th:href="@{/channel/create(groupId = ${currentGroup.id})}">채널생성</a>
            </div>
          </div>
          <!--만들어진 채널들이 있다면-->
          <div class="channel-categorized-group" th:if="${channelGroupResponse}">
            <table class="categorized-channel-table" th:each="categories : ${channelGroupResponse.categorizedChannels}">
              <!--카테고리를 가진 채널이 있다면-->
              <thead th:if="${categories}">
                <th th:text="${categories.name}"></th>
                <th>
                  <a th:href="@{/channel/create(groupId = ${currentGroup.id}, categoryId = ${categories.id})}">채널생성</a>
                </th>
              </thead>
              <tbody class="categorized-channel-table-body">
                <tr class="categorized-channel-table-row" th:each="channel : ${categories.channels}">
                  <th th:text="${channel.channelName}"></th>
                  <td th:text="${channel.channelType}"></td>
                  <td th:text="${channel.channelIsSecret}"></td>
                  <td>
                    <a th:href="@{/channel/enter/{channelId}(channelId = ${channel.channelId}, groupId = ${currentGroup.id})}">채널입장</a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <hr/>
          <!--카테고리 없는 채널-->
          <div class="channel-uncategorized-group" th:if="${channelGroupResponse}">
            <table th:each="channels : ${channelGroupResponse.uncategorizedChannels}">
              <tbody th:if="${channels}" >
                <tr th:each="channel : ${channels}">
                  <th th:text="${channel.channelName}"></th>
                  <td th:text="${channel.channelType}"></td>
                  <td th:text="${channel.channelIsSecret}"></td>
                  <td>
                    <a th:href="@{/channel/enter/{channelId}(channelId = ${channel.channelId}, groupId = ${currentGroup.id})}">채널입장</a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="character-info">
        <p>자신의 정보</p>
      </div>
    </div>

    <!--*************-->
    <!--****채팅방****-->
    <div class="center">
      <div class="center-header">
        <div th:if="${currentChannel}">
          <h2 th:text="${currentChannel.name}"></h2> <!--채팅방 title-->
        </div>
        <div class="icon">
          <button type="button" id="chatUserlist" class="chat-userlist">user</button> <!--채팅방 visitor 햄버거버튼-->
        </div>
      </div>
      <!--메시지 공간 80vh-->
      <div id="chatBox" class="chat-box">
        <!-- 서버로부터 받아온 메시지가 존재하면-->
        <div th:if="${chatMessageResponseList}">
          <!--개별 메시지 wrapper-->
          <div class="chatmessage-wrapper" th:each="chatMessageResponse : ${chatMessageResponseList}">
            <div class="chatmessage-profile-wrapper">
              <img class="chatmessage-profile" th:src="@{${chatMessageResponse.profile}}">
            </div>
            <div class="chatmessage-second-wrapper">
              <div class="chatmessage-upper-wrapper">
                <div class="chatmessage-nickname-wrapper">
                  <p class="chatmessage-nickname" th:text="${chatMessageResponse.nickname}"></p>
                </div>
                <div class="chatmessage-createdat-wrapper">
                  <p class="chatmessage-createdat" th:text="${chatMessageResponse.createdAt}"></p>
                </div>
              </div>
              <div class="chatmessage-content-wrapper">
                <p class="chatmessage-content" th:text="${chatMessageResponse.content}"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="chat-input-wrapper">
        <button type="button" id="uploadFileBtn" class="upload-file-btn" onclick="uploadFile()">File</button>
        <input id="chatInput" class="chat-input" placeholder="채팅 입력" autofocus>
        <button type="button" id="sendMsgBtn" class="send-msg-btn">Send</button>
      </div>
    </div>
    <div class="right">
      <div>
        <h2>현재 접속자</h2>
      </div>
      <div>
        <p>온라인-200</p>
      </div>
      <div class="chat-online-participants-wrapper">
        <p>참가자 리스트</p>
      </div>
      <div>
        <p>오프라인-200(설정으로 보이게 안보이게 가능)</p>
      </div>
      <div class="chat-offline-participants-wrapper">
        <p>참가자 리스트</p>
      </div>
    </div>
    <!--*************-->
  </div>
  <script>

  </script>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<!--<script th:replace="~{modal/invite-channel-modal :: invite-modal-js}"></script>-->
<script th:inline="javascript">
  /*
    * ajax 요청시 자동으로 header에 csrf 토큰 삽입
    * */
  $(function () {
    var csrfToken = [[${_csrf.token}]];
    var csrfHeader = [[${_csrf.headerName}]];

    $(document).ajaxSend(function (e, xhr, options) {
      xhr.setRequestHeader(csrfHeader, csrfToken);
    });
  })

  /* 채널 접속시 channelId 할당*/
  const currentChannelId = [[${currentChannel != null ? currentChannel.id : null}]];
  let stompClient = null;

  /*
  * 돔 렌더링 모두 완료되고 실행
  * */
  $(document).ready(function () {
    /* 초대버튼 클릭시 */
    /*document.getElementById("inviteChannelBtn").onclick = () => {
      inviteChannelModal.style.display = 'block';
    }*/
    /* chatInput 엔터 클릭시 */
    document.getElementById("chatInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    document.getElementById("sendMsgBtn").onclick = () => {
      sendMessage();
    }

    /* 소켓연결 */
    if (currentChannelId) {
      console.log("채널에 접속하여 소켓을 연결합니다. ID : ", currentChannelId);
      connect();
    } else {
      console.log("현재 선택된 채널이 없습니다.");
    }

    function connect() {
      const socket = new SockJS('/ws-stomp');
      stompClient = Stomp.over(socket);

      stompClient.connect({}, function (frame) {
        console.log('Connected: ' + frame);

        // 구독
        stompClient.subscribe('/sub/channel/' + currentChannelId, function (response) {
          const message = JSON.parse(response.body);
          renderMessage(message);
        });
      }, function (error) {
        console.log('Error: ' + error);
      });
    }

    /*
    * response rendering
    * */
    function renderMessage(data) {
      let chatMessageProfileWrapper = document.createElement("div");
      chatMessageProfileWrapper.className = "chatmessage-profile-wrapper";

      /*프로필 이미지*/
      let chatMessageProfile = document.createElement("img");
      chatMessageProfile.className = "chatmessage-profile";
      const profile = data.profile;
      chatMessageProfile.src = profile;
      chatMessageProfileWrapper.appendChild(chatMessageProfile)

      /*닉네임*/
      let chatMessageNicknameWrapper = document.createElement("div");
      chatMessageNicknameWrapper.className = "chatmessage-nickname-wrapper";

      let chatMessageNickname = document.createElement("p");
      chatMessageNickname.className = "chatmessage-nickname";
      const nickname = data.nickname;
      chatMessageNickname.textContent = nickname.toString();
      chatMessageNicknameWrapper.appendChild(chatMessageNickname);

      /*생성날짜*/
      let chatMessageCreatedAtWrapper = document.createElement("div");
      chatMessageCreatedAtWrapper.className = "chatmessage-createdat-wrapper";
      let chatMessageCreatedAt = document.createElement("p");
      chatMessageCreatedAt.className = "chatmessage-createdat";
      const createdAt = data.createdAt;
      chatMessageCreatedAt.textContent = createdAt;
      chatMessageCreatedAtWrapper.appendChild(chatMessageCreatedAt);

      /*내용*/
      let chatMessageContentWrapper = document.createElement("div");
      chatMessageContentWrapper.className = "chatmessage-content-wrapper";
      let chatMessageContent = document.createElement("p");
      chatMessageContent.className = "chatmessage-content";
      const content = data.content;
      chatMessageContent.textContent = content;
      chatMessageContentWrapper.appendChild(chatMessageContent);


      /*UpperWrapper : 닉네임, 생성날짜 상위 래퍼*/
      let chatMessageUpperWrapper = document.createElement("div");
      chatMessageUpperWrapper.className = "chatmessage-upper-wrapper";
      chatMessageUpperWrapper.appendChild(chatMessageNicknameWrapper);
      chatMessageUpperWrapper.appendChild(chatMessageCreatedAtWrapper);

      /*secondWrapper: UpperWrapper(닉네임, 생성날짜), 내용 상위 래퍼*/
      let chatMessageSecondWrapper = document.createElement("div");
      chatMessageSecondWrapper.className = "chatmessage-second-wrapper";
      chatMessageSecondWrapper.appendChild(chatMessageUpperWrapper);
      chatMessageSecondWrapper.appendChild(chatMessageContentWrapper);


      /*inputMessageWrapper : profile, secondWrapper 상위 래퍼*/
      let inputMessageWrapper = document.createElement("div");
      inputMessageWrapper.style.display = "flex";
      inputMessageWrapper.className = "inputmessage-wrapper";
      inputMessageWrapper.appendChild(chatMessageProfileWrapper);
      inputMessageWrapper.appendChild(chatMessageSecondWrapper);

      /*chatBox : 최상위 래퍼. chatMessageWrapper 상위 래퍼*/
      const container = document.getElementById("chatBox");

      /*아래서부터 위로 append*/
      container.prepend(inputMessageWrapper);

      /*스크롤 맨아래로*/
      container.scrollTop = 0;
    }

    /* sendMsgBtn 클릭시 */
    function sendMessage() {
      const inputBox = document.getElementById("chatInput");
      if (!inputBox.value || !stompClient) return;

      // payload
      const chatRequest = {
        channelId : currentChannelId,
        content : inputBox.value,
      }

      stompClient.send("/pub/chatmessage/save", {}, JSON.stringify(chatRequest));

      /*inputBox 초기화*/
      inputBox.value = '';
    }
  });

  function uploadFile() {
    alert('upload!')
  }
</script>

</html>
